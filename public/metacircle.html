<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>元环智能 · 标志结构演示</title>
<style>
:root{color-scheme:dark;--ink-black:#d6d3dc;--ink-purple:#aa84ff;--line:#303034;font:15px/1.5 "PingFang SC",system-ui,sans-serif;color:#f5f4f6;background:#0b0b0c}
*{box-sizing:border-box}
body{margin:0}
main{--content-inset:20px;--toolbar-height:32px;--panel-width:clamp(238px,22vw,290px);min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) clamp(232.2px,19.8vw,288px);padding:0}
#stage{grid-area:1/1;position:relative;min-height:460px;overflow:hidden;background-color:#09090c;background-image:radial-gradient(ellipse at 50% 45%,#20223255,transparent 70%),radial-gradient(circle at 12px 12px,#2f2f2f 1px,transparent 1.4px);background-size:auto,24px 24px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.hud-item{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}.hud-sep{width:3px;height:3px;border-radius:50%;background:#64616e}.hint{display:flex;flex-wrap:wrap;align-items:center;gap:7px 11px;position:absolute;bottom:var(--content-inset);left:var(--content-inset);max-width:calc(100% - 40px);padding:6px 14px;border:1px solid #25262d;border-radius:22px;background:#101116;pointer-events:none;color:#b3afb9;font-size:12px}
aside{--inspector-padding:clamp(16px,1.5vw,23px);grid-area:1/2;min-width:0;background:#101116;border-left:1px solid #202127}
.page-header{position:absolute;z-index:1;top:var(--content-inset);left:var(--content-inset);padding:0;pointer-events:none}
.page-header img{display:block;width:193.21px;height:auto}

p{margin:0;color:#aaa7ae;line-height:1.65;font-size:13px;font-weight:400}
section{border-top:1px solid var(--line);padding-top:19px;margin-top:21px}
.controls-group > section:first-of-type{border-top:0;padding-top:0;margin-top:14px}
aside h3,aside .label{font-size:14px;font-weight:400;color:#d0cdd5}
aside h3,aside .label{margin:0 0 8px}
.buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;padding:3px;border:1px solid #39393e;border-radius:10px;background:#27272a}
.views{grid-template-columns:repeat(3,minmax(0,1fr))}
button{font:inherit;font-size:12px;color:#dfdce4;padding:5px 2px;background:transparent;border:1px solid transparent;border-radius:7px;white-space:nowrap;cursor:pointer}
.buttons button{font-weight:400;color:#efedf2}
.buttons button:is([data-module],[data-hidden-lines]){padding-block:3px}
.buttons button[aria-pressed=true]{color:#141218;background:#f2eff6 padding-box}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink-purple);outline-offset:3px}

.label{display:flex;align-items:center;justify-content:space-between}
output{font:400 12px/1.4 "PingFang SC",system-ui,sans-serif;font-variant-numeric:tabular-nums;border:1px solid #38383e;border-radius:6px;padding:3px 7px;color:#dfdbe7;background:#252527}
input[type=range]{appearance:none;width:100%;height:24px;margin:0;cursor:pointer;border:0;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:4px;background:linear-gradient(90deg,#6B4C9A var(--fill,0%),#303035 var(--fill,0%))}
input[type=range]::-moz-range-track{height:5px;border-radius:4px;background:linear-gradient(90deg,#6B4C9A var(--fill,0%),#303035 var(--fill,0%))}
input[type=range]::-webkit-slider-thumb{appearance:none;width:13px;height:13px;margin-top:-4px;border-radius:50%;background:#e7e0f2}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#e7e0f2}
.range-row{display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:9px;align-items:center}
.range-row output{min-height:28px;display:grid;place-items:center;white-space:nowrap}
.range-row input::-webkit-slider-runnable-track{height:11px;border-radius:999px}
.range-row input::-moz-range-track{height:11px;border-radius:999px}
.range-row input::-webkit-slider-thumb{width:21px;height:13px;margin-top:-1px;border-radius:999px;box-shadow:0 1px 3px #0007}
.range-row input::-moz-range-thumb{width:21px;height:13px;border-radius:999px;box-shadow:0 1px 3px #0007}
.zoom-tools{position:absolute;z-index:1;top:var(--content-inset);right:calc(var(--content-inset) + var(--toolbar-height) + 6px);display:flex;gap:5px;padding:4px;background:#29292b;border:0;border-radius:9px}
.zoom-tools button,.zoom-tools input{height:24px;padding:0 7px;border:0;border-radius:5px;background:transparent;color:#eee;font:inherit;font-size:12px}
.zoom-tools>button{width:29px;padding:0;font-size:17px;color:#a9a7ad}
.zoom-settings summary{height:24px;min-width:56px;display:grid;place-items:center;cursor:pointer;list-style:none;font-size:15px;font-weight:550;font-variant-numeric:tabular-nums}
.zoom-settings summary::-webkit-details-marker{display:none}
.zoom-options{position:absolute;right:0;top:calc(100% + 6px);display:flex;gap:8px;padding:7px;background:#29292b;border-radius:9px;white-space:nowrap}
.zoom-options input{background:#1b1a1b}
.zoom-tools button:hover{background:#302e31}
.zoom-tools #zoom-reset{position:absolute;left:calc(100% + 6px);top:0;width:var(--toolbar-height);height:var(--toolbar-height);background:#29292b;border-radius:9px;color:#eee}
.zoom-tools #zoom-reset:hover{background:#38383b}
.zoom-tools label{display:flex;align-items:center;font-size:12px;gap:3px}
.zoom-tools input{width:44px;text-align:right;appearance:textfield}
.zoom-tools input::-webkit-inner-spin-button{appearance:none}
.inspector-header{height:calc(2 * var(--content-inset) + var(--toolbar-height) + 1px);display:flex;align-items:center;justify-content:space-between;padding:0 var(--inspector-padding);border-bottom:1px solid #202127;color:#9294a4;font-size:11px;letter-spacing:.09em}
.inspector-toggle{padding:0;width:32px;height:32px;display:grid;place-items:center;color:#dedde6;font-size:17px}
.inspector-toggle svg{display:block;width:22px;height:22px}
#close-inspector{width:var(--toolbar-height);height:var(--toolbar-height)}#reopen-inspector svg{transform:scaleX(-1)}
.inspector-toggle:hover{background:#202127}
.inspector-body{padding:26px var(--inspector-padding)}
.inspector-description{padding:16px 18px;background:#15161b;border:1px solid #25262c;border-radius:9px;color:#cdccd7}
aside .controls-group{margin-top:44px}
.controls-group section{border-top:0;padding-top:0;margin-top:17px}
.controls-group section + section{border-top:1px solid #23242a;padding-top:11px}
.buttons button:not([aria-pressed=true]){background:transparent;border-color:transparent;color:#b9b9c6}
.buttons button:not([aria-pressed=true]):hover{color:#eee}
.buttons.view-presets{gap:6px;padding:0;border:0;background:transparent}
.buttons.view-presets button:not([aria-pressed=true]){background:#27272a}
.buttons.view-presets button:not([aria-pressed=true]):hover{background:#35343a}
#reopen-inspector{position:absolute;right:var(--content-inset);top:var(--content-inset);z-index:2;width:var(--toolbar-height);height:var(--toolbar-height);border-radius:9px;background:#29292b}
#reopen-inspector[hidden],.inspector-closed aside{display:none}
main.inspector-closed{grid-template-columns:minmax(0,1fr)}
.inspector-closed .zoom-tools{right:calc(var(--content-inset) + 2 * var(--toolbar-height) + 22px)}
.mobile-inspector-toggle{display:none}
@media(min-width:761px){
  main{height:100dvh;grid-template-rows:minmax(0,1fr)}
  #stage,aside{min-height:0}
  aside{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
}
@media(max-width:760px){
  main{--content-inset:14px;grid-template-columns:minmax(0,1fr)}
  #stage{min-height:clamp(420px,72dvh,560px)}
  main.inspector-closed{grid-template-rows:minmax(0,1fr) auto}
  aside{grid-area:2/1;border-left:0;border-top:1px solid #202127}
  .hint{display:none}
  .zoom-tools,.inspector-closed .zoom-tools{top:auto;bottom:var(--content-inset);right:calc(var(--content-inset) + 34px);gap:1px;padding:3px}
  .zoom-options{top:auto;bottom:calc(100% + 6px)}
  .zoom-tools #zoom-reset{left:calc(100% + 4px);width:30px;height:30px}
  .inspector-header{height:52px}
  aside .controls-group{margin-top:30px}
  .inspector-closed aside{display:block}
  .inspector-closed .inspector-body{display:none}
  #close-inspector,#reopen-inspector{display:none}
  .mobile-inspector-toggle{display:grid;width:30px;height:30px;background:transparent;border:0;border-radius:9px}
  .mobile-inspector-toggle:hover{background:transparent}
  .mobile-inspector-toggle:active{background:#29292b}
  .mobile-inspector-toggle::after{content:"";width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(2px) rotate(225deg)}
  .mobile-inspector-toggle[aria-expanded=false]::after{transform:translateY(-2px) rotate(45deg)}
}
.module-colors{display:grid;grid-template-columns:minmax(52px,1fr) minmax(88px,1.55fr) 33px;align-items:center;gap:8px 10px;font-size:12px;color:#d0cdd5}
.color-entry{display:flex;align-items:center;min-width:0;height:30px;padding:0 6px;gap:6px;border:1px solid #35353e;border-radius:6px;background:#141419}.color-module{display:grid;place-items:center;padding:0;width:16px;height:16px;flex:none}
.module-colors input[type=text]{min-width:0;width:100%;height:26px;padding:0;border:0;background:transparent;color:#eee;font:inherit}
.color-entry:has(input[aria-invalid=true]){border-color:#db8089}
#inspector .module-colors > label{font-size:12px;font-weight:400;color:#85818f}
.module-colors .color-reset{margin:0;padding:2px 0;color:#85818f}
.color-chip{width:16px;height:16px;flex:none;background:var(--color);border:1px solid #ffffff33;border-radius:3px}
.color-popup{position:fixed;z-index:10;width:min(224px,calc(100vw - 24px));padding:12px;box-shadow:0 8px 24px #0008;background:#1c1d23;border:1px solid #35353e;border-radius:12px}
.color-popup[hidden]{display:none}
.color-field{position:relative;height:92px;border-radius:7px;touch-action:none;cursor:crosshair;background:linear-gradient(0deg,#000,transparent),linear-gradient(90deg,#fff,transparent),hsl(var(--hue,270) 100% 50%)}
.color-cursor{position:absolute;left:var(--x,50%);top:var(--y,50%);width:9px;height:9px;border:1px solid white;border-radius:50%;box-shadow:0 0 0 1px #000;transform:translate(-50%,-50%);pointer-events:none}
.color-popup .hue::-webkit-slider-runnable-track{background:linear-gradient(90deg,red,yellow,lime,cyan,blue,magenta,red)}
.color-popup .hue::-moz-range-track{background:linear-gradient(90deg,red,yellow,lime,cyan,blue,magenta,red)}
.hex-row{display:flex;align-items:center;gap:9px;font-size:12px;color:#d0cdd5}
.hex-row input{width:100%;min-width:0;height:30px;padding:0 8px;border:1px solid #35353e;border-radius:6px;background:#141419;color:#eee;font:inherit}
.color-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.color-actions button{min-width:48px;height:25px;padding:0 8px;background:#292930;font-size:12px}
.color-actions .color-confirm{background:#f2eff6;color:#141218}
.hex-row input[aria-invalid=true]{border-color:#db8089}
.color-reset{margin-top:6px;padding:4px 0;color:#d0cdd5}
.page-header,.hint,.zoom-tools,#reopen-inspector,.inspector-header,.inspector-body{zoom:0.9}
</style>
</head>
<body>
<main>
<div id="stage"><header class="page-header">
  <img src="/metacircle-logo.svg" alt="元环智能" width="193" height="36">
</header><button class="inspector-toggle" type="button" id="reopen-inspector" aria-label="展开模型控制" aria-controls="inspector" title="展开参数调整" hidden><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect><line x1="15" y1="3" x2="15" y2="21"></line><polyline points="11 9 8 12 11 15"></polyline></svg></button><div class="zoom-tools" role="group" aria-label="缩放比例">

</div>
<div class="hud-sep"></div>
<div class="hud-item"><svg aria-hidden="true" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24" width="14"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="8 8 3 8 3 3"></polyline><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><polyline points="16 16 21 16 21 21"></polyline></svg><span>拖动旋转</span></div>
<div class="hud-sep"></div>
<div class="hud-item">

</div>
<div class="hud-sep"></div>
<div class="hud-item">
<svg aria-hidden="true" fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24" width="14">
<path d="M5 9l-3 3 3 3"></path>

</svg>
<span>右键平移</span></div></div></div>
  <aside id="inspector">
    <header class="inspector-header"><button class="inspector-toggle" type="button" id="close-inspector" aria-label="收起模型控制" aria-controls="inspector" title="收起参数调整"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect><line x1="15" y1="3" x2="15" y2="21"></line><polyline points="11 9 8 12 11 15"></polyline></svg></button><button class="inspector-toggle mobile-inspector-toggle" id="mobile-inspector-toggle" type="button" aria-controls="inspector-body" aria-expanded="true" aria-label="收起参数调整"></button><span>INSPECTOR</span></header>
    <div class="inspector-body" id="inspector-body">
    <p class="inspector-description">元环智能的 logo 以「元」的首字母 Y 为形态原点，将两个独立的几何单元，以榫卯为灵感组合为完整标志。</p>
    <div class="controls-group" role="group" aria-label="参数调整">

      <button type="button" data-module="1" aria-pressed="false">左结构元</button>
      <button type="button" data-module="0" aria-pressed="false">右结构元</button>

<script>
(() => {
  const root = document.documentElement;
  const canvas = root.querySelector('canvas');
  const slider = root.querySelector('#assembly');
  const ctx = canvas.getContext('2d');
  let yaw = -Math.PI/4;
  let pitch = -Math.asin(1/Math.sqrt(3));
  let drag = null;
  const faces = [];

  function solid(axes, occupied, moving, warp = point => point) {
    const [xs,ys,zs] = axes;
    for (let i=0;i<xs.length-1;i++) for (let j=0;j<ys.length-1;j++) for (let k=0;k<zs.length-1;k++) {
      if (!occupied(i,j,k)) continue;
      const cell = [i,j,k];
      for (let axis=0;axis<3;axis++) for (const side of [-1,1]) {
        const next = cell.slice();
        next[axis] += side;
        if (next.every((n,d)=>n>=0 && n<axes[d].length-1) && occupied(...next)) continue;
        const a=(axis+1)%3, b=(axis+2)%3;
        const points = [[0,0],[1,0],[1,1],[0,1]].map(([u,v])=>{
          const corner=cell.slice();
          corner[axis]+=side>0 ? 1 : 0;
          corner[a]+=u;
          corner[b]+=v;
          return warp(corner.map((n,d)=>axes[d][n]));
        });
        faces.push({points,axis,side,moving});
      }
    }
  }

  // The three views share a square foot and perpendicular extrusion axes.
  const top = 223/79;
  const shoulder = -91/68;
  const tongueBottom = top - 111/79;
  const tongueTop = top - 36/79;
  const fit = 0.004;
  const width = 1;
  const depth = 1;
  const lipStart = depth - 0.22;
  solid([[shoulder,0,lipStart,depth], [0,width], [tongueBottom,tongueTop,top]],
    (i,j,k)=>i===0 || i===2 || k===0, true);

  const underside = top - 151/79;
  const curveStart = underside - 0.44;
  const curveLevels = Array.from({length:17}, (_,i) =>
    curveStart + (underside-curveStart)*Math.sin(i*Math.PI/32));
  const arm = curveLevels.length;
  const footInside = 0;
  const slotInside = -0.25;
  const outside = -91/68;
  // The raised lip slides alongside the capped portion of the groove.
  solid([[0,lipStart-fit,depth],[outside,slotInside,footInside,width],
    [0,...curveLevels,tongueBottom-fit,tongueTop+fit,top]],
    (i,j,k)=>k<arm ? j===2 : k===arm || j===0 || (k===arm+2 && i===0),
    false, ([x,y,z])=>{
      if(z>underside || y===outside) return [x,y,z];
      const t=Math.max(0,(z-curveStart)/(underside-curveStart));
      const bend=0.62*(1-Math.sqrt(Math.max(0,1-t*t)));
      // Shift the inner edge of the foot while holding its outside edge fixed.
      const weight = y < 0 ? (y-outside)/(-outside) : 1-y/width;
      return [x,y-bend*weight,z];
    });

  const curvedJoin = -0.62;
  const edgeMap = new Map();
  for (const face of faces) {
    face.points.forEach((a,i)=>{
      const b=face.points[(i+1)%4];
      const key=Number(face.moving)+':'+[a.join(','),b.join(',')].sort().join('|');
      if (!edgeMap.has(key)) edgeMap.set(key,{a,b,moving:face.moving,axes:new Set()});
      edgeMap.get(key).axes.add(face.axis);
    });
  }
  const edges=[...edgeMap.values()].filter(({a,b,moving,axes})=>{
    const tangentJoin = !moving && a[0]!==b[0] &&
      [a,b].every(([,y,z])=>Math.abs(y-curvedJoin)<1e-7 && Math.abs(z-underside)<1e-7);
    return axes.size>1 && !tangentJoin;
  });
  const stroke=root.querySelector('#stroke');
  const assemblyValue=root.querySelector('#assembly-value');
  const strokeValue=root.querySelector('#stroke-value');
  const moduleButtons=[...root.querySelectorAll('[data-module]')];
  const viewButtons=[...root.querySelectorAll('[data-view]')];
  const hiddenLineButtons=[...root.querySelectorAll('[data-hidden-lines]')];
  let showHidden=true;
  let selected=null;
  const originalColors=['#4F2C5B','#6B4C9A'];
  const strokeColors=[...originalColors];
  let hitFaces=[];
  const zoomValue=root.querySelector('#zoom-value');
  const zoomDisplay=root.querySelector('#zoom-display');
  const layout=root.querySelector('main');
  const closeInspector=root.querySelector('#close-inspector');
  const reopenInspector=root.querySelector('#reopen-inspector');
  const mobileToggle=root.querySelector('#mobile-inspector-toggle');
  function setInspectorOpen(open){
    reopenInspector.hidden=open;
    layout.classList.toggle('inspector-closed',!open);
    mobileToggle.setAttribute('aria-expanded',open);
    mobileToggle.setAttribute('aria-label',open ? '收起参数调整' : '展开参数调整');
  }
  closeInspector.addEventListener('click',()=>{setInspectorOpen(false); reopenInspector.focus();});
  reopenInspector.addEventListener('click',()=>{setInspectorOpen(true); closeInspector.focus();});
  mobileToggle.addEventListener('click',()=>setInspectorOpen(layout.classList.contains('inspector-closed')));
  let zoom=1, panX=0, panY=0;

  function triangle(a,b,c) {
    const det=(b[1]-c[1])*(a[0]-c[0])+(c[0]-b[0])*(a[1]-c[1]);
    if(Math.abs(det)<1e-7) return null;
    return {a,b,c,det,minX:Math.min(a[0],b[0],c[0]),maxX:Math.max(a[0],b[0],c[0]),
      minY:Math.min(a[1],b[1],c[1]),maxY:Math.max(a[1],b[1],c[1])};
  }

  function depthAt(t,x,y) {
    if(x<t.minX || x>t.maxX || y<t.minY || y>t.maxY) return -Infinity;
    const {a,b,c,det}=t;
    const u=((b[1]-c[1])*(x-c[0])+(c[0]-b[0])*(y-c[1]))/det;
    const v=((c[1]-a[1])*(x-c[0])+(a[0]-c[0])*(y-c[1]))/det;
    return u>=-1e-7 && v>=-1e-7 && u+v<=1+1e-7
      ? u*a[2]+v*b[2]+(1-u-v)*c[2] : -Infinity;
  }

  function draw() {
    const w=canvas.clientWidth, h=canvas.clientHeight, dpr=window.devicePixelRatio || 1;
    if (!w || !h) return;
    canvas.width=Math.round(w*dpr);
    canvas.height=Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const s=Math.sin(yaw), c=Math.cos(yaw), tilt=Math.sin(pitch);
    const lift=Math.cos(pitch);
    const offset=Number(slider.value)*0.0155;
    const project=([x,y,z],moving)=>{
      y+=(moving ? offset : 0)-offset/2;
      z-=1.41;
      const radial=s*x-c*y;
      const depth=lift*radial+tilt*z;
      return [c*x+s*y,tilt*radial-lift*z,depth];
    };

    const polygons=faces.map(face=>face.points.map(point=>project(point,face.moving)));
    const points=polygons.flat();
    const xs=points.map(p=>p[0]), ys=points.map(p=>p[1]);
    const left=Math.min(...xs), right=Math.max(...xs);
    const top=Math.min(...ys), bottom=Math.max(...ys);
    const compact=matchMedia('(max-width:760px)').matches;
    const modelWidth=w;
    const modelHeight=h;
    const usableHeight=Math.max(80,modelHeight-(compact ? 205 : 132));
    const fittedScale=Math.min(Math.max(60,modelWidth-(compact ? 36 : 108))/Math.max(right-left,3.9),usableHeight/Math.max(bottom-top,3.0));
    const modelSpan=Math.max(right-left,bottom-top);
    const framingInset=compact ? 12 : 88;
    const scale=0.81*zoom*Math.max(fittedScale*0.55,fittedScale-framingInset/modelSpan);
    const screen=([x,y,d])=>[modelWidth/2+panX+(x-(left+right)/2)*scale,modelHeight/2+(compact ? 8 : 0)+panY+(y-(top+bottom)/2)*scale,d];
    const triangles=polygons.flatMap((poly,index)=>{
      const [a,b,c,d]=poly.map(screen);
      return [triangle(a,b,c),triangle(a,c,d)].filter(Boolean).map(face=>Object.assign(face,{moving:faces[index].moving}));
    });
    hitFaces=triangles;
    const gradientStart=screen([left,top,0]);
    const gradientEnd=screen([right,bottom,0]);
    const colors=strokeColors.map((dark,index)=>{
      const light=dark===originalColors[index] ? ['#B592BD','#BEA7E0'][index] :
        '#'+dark.slice(1).match(/../g).map(pair=>Math.round(parseInt(pair,16)*0.58+255*0.42).toString(16).padStart(2,'0')).join('');
      const gradient=ctx.createLinearGradient(gradientStart[0],gradientStart[1],gradientEnd[0],gradientEnd[1]);
      gradient.addColorStop(0,light);
      gradient.addColorStop(1,dark);
      return gradient;
    });

    const silhouettes=[new Path2D(),new Path2D()];
    for(const {a,b,c,moving,det} of triangles){
      const path=silhouettes[Number(moving)];
      path.moveTo(a[0],a[1]);
      for(const point of det>0 ? [b,c] : [c,b]) path.lineTo(point[0],point[1]);
      path.closePath();
    }
    for(const module of selected===0 ? [1,0] : [0,1]){
      ctx.fillStyle=module===selected ? originalColors[module] : '#0B0B0C';
      ctx.fill(silhouettes[module]);
    }
    const runs=[[],[],[],[]];
    for (const edge of edges) {
      const a=screen(project(edge.a,edge.moving)), b=screen(project(edge.b,edge.moving));
      const dx=b[0]-a[0], dy=b[1]-a[1], dd=b[2]-a[2];
      const steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)));
      let previous=null;
      for(let i=0;i<steps;i++){
        const fraction=(i+0.5)/steps;
        const hidden=triangles.some(t=>depthAt(t,a[0]+dx*fraction,a[1]+dy*fraction)>a[2]+dd*fraction+1e-6);
        const group=2*Number(hidden)+Number(edge.moving);
        if (group!==previous) runs[group].push([[a[0]+dx*i/steps,a[1]+dy*i/steps],null]);
        runs[group].at(-1)[1]=[a[0]+dx*(i+1)/steps,a[1]+dy*(i+1)/steps];
        previous=group;
      }
    }
    // Screen-space fillets follow the projected edges in every view.
    const cornerInset=Math.min(6,Math.max(3.5,scale*0.038));
    const paths=runs.map((segments,index)=>roundedPaths(segments,index<2 ? cornerInset : 1.6));
    ctx.lineCap='round';
    ctx.lineJoin='round';
    for (const i of [2,3,0,1]) {
      ctx.strokeStyle=colors[i%2];
      ctx.globalAlpha=(i>=2 ? 0.30 : 1)*(selected===null || selected===i%2 ? 1 : 0.55);
      ctx.lineWidth=Number(stroke.value)*(i>=2 ? 0.53 : 1);
      ctx.setLineDash(i>=2 ? [4,4] : []);
      if(i<2 || showHidden) ctx.stroke(paths[i]);
    }
  }

  function roundedPaths(segments,radius){
    const path=new Path2D();
    const corners=new Map();
    const trimmed=segments.map(segment=>segment.slice());
    for(const [index,segment] of segments.entries()){
      for(const [end,point] of segment.entries()){
        const key=point.map(value=>value.toFixed(4)).join(',');
        if(!corners.has(key)) corners.set(key,[]);
        corners.get(key).push({index,end,point});
      }
    }
    if(radius) for(const adjoining of corners.values()){
      if(adjoining.length!==2 || adjoining[0].index===adjoining[1].index) continue;
      const [first,second]=adjoining;
      const directions=adjoining.map(({index,end,point})=>{
        const [x,y]=segments[index][1-end];
        const length=Math.hypot(x-point[0],y-point[1]);
        return length>0.1 ? [(x-point[0])/length,(y-point[1])/length] : null;
      });
      if(directions.some(direction=>!direction)) continue;
      const [u,v]=directions;
      const cosine=u[0]*v[0]+u[1]*v[1];
      if(Math.abs(cosine)>0.995) continue;
      const tips=adjoining.map(({index,end,point})=>{
        const [x,y]=segments[index][1-end];
        const distance=Math.hypot(x-point[0],y-point[1]);
        if(distance<0.1) return null;
        const ratio=Math.min(radius/distance,0.24);
        return [point[0]+(x-point[0])*ratio,point[1]+(y-point[1])*ratio];
      });
      if(tips.some(tip=>tip===null)) continue;
      trimmed[first.index][first.end]=tips[0];
      trimmed[second.index][second.end]=tips[1];
      path.moveTo(...tips[0]);
      path.quadraticCurveTo(...first.point,...tips[1]);
    }
    for(const [start,end] of trimmed){
      path.moveTo(...start);
      path.lineTo(...end);
    }
    return path;
  }

  function selectModule(module){
    selected=module;
    for(const button of moduleButtons) button.setAttribute('aria-pressed', button.dataset.module===(selected===null ? 'none' : String(selected)));
    draw();
  }

  const colorPopup=root.querySelector('#color-popup');
  document.body.append(colorPopup);
  const colorField=colorPopup.querySelector('.color-field');
  const hue=colorPopup.querySelector('.hue');
  const hex=colorPopup.querySelector('#fill-hex');
  const colorButtons=[...root.querySelectorAll('[data-color-module]')];
  let activeColorModule=null;
  let colorBeforePreview=null;
  let saturation=0, brightness=0;

  function updateColorField(){
    colorField.style.setProperty('--hue',hue.value);
    colorField.style.setProperty('--x',saturation*100+'%');
    colorField.style.setProperty('--y',(1-brightness)*100+'%');
  }

  function syncPalette(color){
    const [r,g,b]=color.slice(1).match(/../g).map(pair=>parseInt(pair,16)/255);
    const max=Math.max(r,g,b), min=Math.min(r,g,b), delta=max-min;
    const sector=delta===0 ? 0 : max===r ? (g-b)/delta : max===g ? 2+(b-r)/delta : 4+(r-g)/delta;
    hue.value=Math.round((sector*60+360)%360);
    saturation=max ? delta/max : 0;
    brightness=max;
    updateColorField();
  }

  function applyColor(color,module=activeColorModule){
    strokeColors[module]=color;
    const button=colorButtons.find(item=>Number(item.dataset.colorModule)===module);
    root.querySelector('#fill-hex-'+module).value=color.slice(1);
    button.querySelector('.color-chip').style.setProperty('--color',color);
    hex.removeAttribute('aria-invalid');
    draw();
  }

  function applyPalette(){
    const chroma=brightness*saturation;
    const sector=Number(hue.value)%360/60;
    const cross=chroma*(1-Math.abs(sector%2-1));
    const channels=[[chroma,cross,0],[cross,chroma,0],[0,chroma,cross],
      [0,cross,chroma],[cross,0,chroma],[chroma,0,cross]][Math.floor(sector)];
    hex.value=channels.map(channel=>Math.round((channel+brightness-chroma)*255).toString(16).padStart(2,'0')).join('').toUpperCase();
    updateColorField();
    applyColor('#'+hex.value);
  }

  function positionPalette(){
    if(colorPopup.hidden) return;
    const trigger=colorButtons.find(button=>Number(button.dataset.colorModule)===activeColorModule);
    const bounds=trigger.getBoundingClientRect();
    if(bounds.bottom<0 || bounds.top>innerHeight || !trigger.getClientRects().length){
      closePalette();
      return;
    }
    const {offsetWidth:width,offsetHeight:height}=colorPopup;
    const left=bounds.left-width-10;
    const fitsLeft=left>=12;
    const top=fitsLeft ? bounds.top : bounds.top-height-8;
    colorPopup.style.left=Math.max(12,Math.min(innerWidth-width-12,fitsLeft ? left : bounds.left))+'px';
    colorPopup.style.top=Math.max(12,Math.min(innerHeight-height-12,top))+'px';
  }

  for(const button of colorButtons) button.addEventListener('click',()=>{
    const module=Number(button.dataset.colorModule);
    activeColorModule=activeColorModule===module ? null : module;
    colorPopup.hidden=activeColorModule===null;
    for(const item of colorButtons) item.setAttribute('aria-expanded',Number(item.dataset.colorModule)===activeColorModule);
    if(colorPopup.hidden) return;
    colorBeforePreview=strokeColors[module];
    hex.value=strokeColors[module].slice(1);
    hex.removeAttribute('aria-invalid');
    syncPalette('#'+hex.value);
    positionPalette();
  });
  window.addEventListener('resize',positionPalette);
  window.addEventListener('scroll',positionPalette,true);
  function closePalette(restoreFocus=false){
    if(activeColorModule===null) return;
    const trigger=colorButtons.find(button=>Number(button.dataset.colorModule)===activeColorModule);
    activeColorModule=null;
    colorPopup.hidden=true;
    trigger.setAttribute('aria-expanded','false');
    if(restoreFocus) trigger.focus();
  }
  function cancelPalette(){
    if(activeColorModule===null) return;
    applyColor(colorBeforePreview,activeColorModule);
    closePalette(true);
  }
  colorPopup.querySelector('.color-confirm').addEventListener('click',()=>{
    if(hex.getAttribute('aria-invalid')==='true') { hex.focus(); return; }
    closePalette(true);
  });
  colorPopup.querySelector('.color-cancel').addEventListener('click',cancelPalette);
  root.addEventListener('click',event=>{
    if(!colorPopup.contains(event.target) && !event.target.closest('[data-color-module]')) closePalette();
  });
  root.addEventListener('keydown',event=>{
    if(event.key==='Escape') cancelPalette();
  });
  function pickColor(event){
    const bounds=colorField.getBoundingClientRect();
    saturation=Math.max(0,Math.min(1,(event.clientX-bounds.left)/bounds.width));
    brightness=1-Math.max(0,Math.min(1,(event.clientY-bounds.top)/bounds.height));
    applyPalette();
  }
  colorField.addEventListener('pointerdown',event=>{
    colorField.setPointerCapture(event.pointerId);
    pickColor(event);
  });
  colorField.addEventListener('pointermove',event=>{
    if(colorField.hasPointerCapture(event.pointerId)) pickColor(event);
  });
  hue.addEventListener('input',applyPalette);
  hex.addEventListener('input',()=>{
    const value=hex.value.trim().replace(/^#/,'');
    hex.removeAttribute('aria-invalid');
    if(!/^[0-9a-f]{6}$/i.test(value)) return;
    const color='#'+value.toUpperCase();
    syncPalette(color);
    applyColor(color);
  });
  hex.addEventListener('change',()=>{
    const value=hex.value.trim().replace(/^#/,'');
    if(!/^(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(value)){
      hex.setAttribute('aria-invalid','true');
      return;
    }
    hex.value=(value.length===3 ? [...value].map(d=>d+d).join('') : value).toUpperCase();
    syncPalette('#'+hex.value);
    applyColor('#'+hex.value);
  });
  hex.addEventListener('keydown',event=>{if(event.key==='Enter') hex.blur();});
  for(const module of [0,1]){
    const input=root.querySelector('#fill-hex-'+module);
    input.addEventListener('change',()=>{
      const digits=input.value.trim().replace(/^#/,'');
      if(!/^(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(digits)){
        input.setAttribute('aria-invalid','true');
        return;
      }
      const color='#'+(digits.length===3 ? [...digits].map(d=>d+d).join('') : digits).toUpperCase();
      input.removeAttribute('aria-invalid');
      applyColor(color,module);
      if(activeColorModule===module){hex.value=color.slice(1);syncPalette(color);}
    });
    input.addEventListener('keydown',event=>{if(event.key==='Enter') input.blur();});
    root.querySelector('[data-reset-color="'+module+'"]').addEventListener('click',()=>{
      const color=originalColors[module];
      input.removeAttribute('aria-invalid');
      applyColor(color,module);
      if(activeColorModule===module){hex.value=color.slice(1);syncPalette(color);}
    });
  }

  function updateSliders(){
    assemblyValue.value=slider.value+'%';
    strokeValue.value=Number(stroke.value).toFixed(1)+' px';
    slider.style.setProperty('--fill',slider.value+'%');
    stroke.style.setProperty('--fill',((stroke.value-stroke.min)/(stroke.max-stroke.min)*100)+'%');
    draw();
  }
  for(const control of [slider,stroke]) control.addEventListener('input',updateSliders);
  for(const button of moduleButtons) button.addEventListener('click',()=>selectModule(button.dataset.module==='none' ? null : Number(button.dataset.module)));

  for(const button of hiddenLineButtons) button.addEventListener('click',()=>{
    showHidden=button.dataset.hiddenLines==='on';
    for(const item of hiddenLineButtons) item.setAttribute('aria-pressed',item===button);
    draw();
  });
  const iso=Math.asin(1/Math.sqrt(3));

  const views={front:[-Math.PI/4,-iso],rear:[3*Math.PI/4,iso],top:[-Math.PI/4,Math.PI/2],bottom:[-Math.PI/4,-Math.PI/2],left:[-Math.PI/2,0],right:[Math.PI/2,0]};
  for(const button of viewButtons) button.addEventListener('click',()=>{
    stopMotion();
    [yaw,pitch]=views[button.dataset.view];

    panX=panY=0;
    zoom=1;
    zoomValue.value=100;
    zoomDisplay.textContent="100%";
    for(const item of viewButtons) item.setAttribute('aria-pressed',item===button);
    draw();
  });

  const damping=0.08;
  let yawDelta=0, pitchDelta=0, panDeltaX=0, panDeltaY=0;
  let motionFrame=0;

  function applyMotion(){
    yaw+=yawDelta*damping;
    pitch=Math.max(-Math.PI/2+1e-6,Math.min(Math.PI/2-1e-6,pitch+pitchDelta*damping));
    panX+=panDeltaX*damping;
    panY+=panDeltaY*damping;
    yawDelta*=1-damping;
    pitchDelta*=1-damping;
    panDeltaX*=1-damping;
    panDeltaY*=1-damping;
    draw();
    motionFrame=Math.max(Math.abs(yawDelta),Math.abs(pitchDelta),
      Math.abs(panDeltaX)/canvas.clientHeight,Math.abs(panDeltaY)/canvas.clientHeight)>0.00008
      ? requestAnimationFrame(applyMotion) : 0;
  }

  function stopMotion(){
    cancelAnimationFrame(motionFrame);
    motionFrame=yawDelta=pitchDelta=panDeltaX=panDeltaY=0;
  }

  let press;
  canvas.addEventListener('pointerdown',e=>{
    if(drag || (e.button!==0 && e.button!==2)) return;
    drag=[e.clientX,e.clientY,e.button===2 || e.ctrlKey || e.metaKey || e.shiftKey,e.pointerId];
    press={x:e.clientX,y:e.clientY,moved:false};
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove',e=>{
    if(!drag || drag[3]!==e.pointerId) return;
    if(!press.moved && Math.hypot(e.clientX-press.x,e.clientY-press.y)<4) return;
    press.moved=true;
    if(!drag[2]){

      for(const button of viewButtons) button.setAttribute('aria-pressed',false);
    }
    const dx=e.clientX-drag[0], dy=e.clientY-drag[1];
    if(drag[2]) {
      panDeltaX+=dx;
      panDeltaY+=dy;
    } else {
      const radiansPerPixel=2*Math.PI/canvas.clientHeight;
      // A rightward drag must move a camera-facing point right on screen.
      yawDelta-=dx*radiansPerPixel;
      pitchDelta+=dy*radiansPerPixel;
    }
    drag[0]=e.clientX;
    drag[1]=e.clientY;
    if(!motionFrame) motionFrame=requestAnimationFrame(applyMotion);
  });
  canvas.addEventListener('pointerup',e=>{
    if(!drag || drag[3]!==e.pointerId || drag[2] || press.moved) return;
    const bounds=canvas.getBoundingClientRect();
    let closest=-Infinity, module=null;
    for(const face of hitFaces){
      const depth=depthAt(face,e.clientX-bounds.left,e.clientY-bounds.top);
      if(depth>closest){ closest=depth; module=Number(face.moving); }
    }
    selectModule(selected===module ? null : module);
  });
  canvas.addEventListener('lostpointercapture',()=>{drag=null;});
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  function setZoom(value){
    if(!Number.isFinite(value)) value=zoom;
    zoom=Math.max(0.35,Math.min(4,value));
    zoomValue.value=Math.round(zoom*100);
    zoomDisplay.textContent=zoomValue.value+"%";
    draw();
  }
  zoomValue.addEventListener('change',()=>setZoom(zoomValue.valueAsNumber/100));
  zoomValue.addEventListener('keydown',event=>{if(event.key==='Enter') zoomValue.blur();});
  root.querySelector('#zoom-out').addEventListener('click',()=>setZoom(zoom-0.1));
  root.querySelector('#zoom-in').addEventListener('click',()=>setZoom(zoom+0.1));
  root.querySelector('#zoom-reset').addEventListener('click',()=>setZoom(1));
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    const delta=e.deltaY*(e.deltaMode===1 ? 16 : e.deltaMode===2 ? canvas.clientHeight : 1);
    setZoom(zoom*Math.exp(-delta*0.0015));
  },{passive:false});
  const resize=new ResizeObserver(draw);
  resize.observe(canvas);
  updateSliders();
})();
</script>
</body>
</html>
